# # version: 'v5'

services:
  # selenium:
  #   image: selenium/standalone-chrome:latest
  #   ports:
  #     - "4444:4444"
  #   environment:
  #     - HUB_HOST=selenium
  #   volumes:
  #     - /dev/shm:/dev/shm
  #   networks:
  #     - laravel      


  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # For LAN access, use self-signed certificates
      - "--providers.file.filename=/traefik/dynamic.yml"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik:/traefik"
    networks:
      - laravel
    environment:
      - HOST_IP=${HOST_IP}


  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - redis
      # - selenium
    networks:
      - laravel
    environment:
      - HOST_IP=${HOST_IP}
      # - DUSK_DRIVER_URL=http://selenium:4444/wd/hub




  webserver:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel
    labels:
      - "traefik.enable=true"
      # # HTTP redirect to HTTPS
      - "traefik.http.routers.nginx-http.rule= Host(`${HOST_IP}`) || Host(`app.${HOST_IP}.nip.io`) || Host(`laravel.local`)"
      - "traefik.http.routers.nginx-http.entrypoints=web"
      - "traefik.http.routers.nginx-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTPS router
      - "traefik.http.routers.nginx.rule= Host(`${HOST_IP}`) || Host(`app.${HOST_IP}.nip.io`) || Host(`laravel.local`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls.certresolver=leresolver"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"



  # db:
  #   image: mysql:8.0
  #   container_name: laravel_db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpass
  #     MYSQL_DATABASE: laravel
  #     MYSQL_USER: laraveluser
  #     MYSQL_PASSWORD: laravelpass
  #   volumes:
  #     - dbdata:/var/lib/mysql
  #     - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
  #   env_file:
  #     - ./src/.env
  #   networks:
  #     - laravel

  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin
  #   container_name: phpmyadmin
  #   depends_on:
  #     - db
  #   environment:
  #     PMA_HOST: db
  #     MYSQL_ROOT_PASSWORD: rootpass
  #   networks:
  #     - laravel
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.local`) || Host(`phpmyadmin.${HOST_IP}.nip.io`)"
  #     - "traefik.http.routers.phpmyadmin.entrypoints=websecure"
  #     - "traefik.http.routers.phpmyadmin.tls.certresolver=leresolver"
  #     - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"


  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel
    ports:
      - "5432:5432"  

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - laravel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.localhost`) || Host(`pgadmin.${HOST_IP}.nip.io`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=leresolver"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - laravel
    ports:
      - "6379:6379"
      

networks:
  laravel:
    driver: bridge


volumes:
  pgadmin_data:
  pgdata:
  dbdata:
  redis_data:
  letsencrypt:


















