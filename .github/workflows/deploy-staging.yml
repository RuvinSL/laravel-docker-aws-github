name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/laravel-app

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/php/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:staging
          ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_STAGING_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull latest image from Docker Hub
          docker pull ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/laravel-app:staging
          
          # Stop existing container
          docker stop laravel-app-staging || true
          docker rm laravel-app-staging || true
          
          # Run new container
          docker run -d \
            --name laravel-app-staging \
            --restart unless-stopped \
            -p 80:80 \
            -v /home/ubuntu/laravel-storage:/var/www/storage \
            -v /home/ubuntu/.env.staging:/var/www/.env \
            --network laravel-network \
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/laravel-app:staging
          
          # Run migrations
          docker exec laravel-app-staging php artisan migrate --force
          
          # Clear caches
          docker exec laravel-app-staging php artisan config:cache
          docker exec laravel-app-staging php artisan route:cache
          docker exec laravel-app-staging php artisan view:cache
          
          # Health check
          sleep 10
          curl -f http://localhost/health || exit 1

    # - name: Notify Slack
